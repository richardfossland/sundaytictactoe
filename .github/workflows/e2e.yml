# The BROWSER tier, as one reusable job.
#
# `ci.yml` calls it on every PR with the desktop project only; `nightly.yml`
# calls it at 03:00 three times over — desktop + mobile Chromium, WebKit, and
# the same desktop project against the OpenNext Worker. Keeping the steps in ONE
# file is deliberate: a Supabase service name or an env-var mapping that drifts
# in only one of the callers is exactly the kind of gap that goes unnoticed
# until the nightly run is the only thing that is red.
#
# Two axes, both driven by inputs:
#
#   `projects` — which browsers. Naming `mobile-webkit` here is what installs
#                WebKit; the config accepts an explicit `--project` without the
#                E2E_WEBKIT env var (see playwright.config.ts).
#   `server`   — `next` (default; `next start`) or `worker` (`wrangler dev` on
#                the OpenNext bundle). See docs/E2E.md for what each proves.
name: e2e

on:
  workflow_call:
    inputs:
      projects:
        description: >-
          Playwright project names, space-separated. Must match `projects[].name`
          in playwright.config.ts.
        type: string
        default: desktop-chromium
      server:
        description: >-
          `next` (production build under `next start`) or `worker` (the OpenNext
          bundle under `wrangler dev`, using wrangler.e2e.jsonc).
        type: string
        default: next
      timeout:
        description: >-
          Job ceiling. The default suits the PR gate (one project, `next start`);
          the nightly lanes ask for more because they run three projects, or pay
          for the OpenNext bundling pass and a workerd boot.
        type: number
        default: 20

# Reusable workflows inherit the caller's permissions unless declared here —
# be explicit rather than relying on whatever ci.yml/nightly.yml happen to grant.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # A full one-project `next start` run is ~6-8 min (Supabase boot + production
    # build + the suite). The default 20 leaves room for a cold image pull without
    # letting a hung server burn an hour; callers that run more projects, or the
    # worker lane, raise it (see the input).
    timeout-minutes: ${{ inputs.timeout }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Browsers are versioned WITH @playwright/test — a bumped library and a
      # stale binary is an unsupported pair — so the cache key is that exact
      # version, read from the lockfile-resolved package rather than package.json's
      # caret range.
      - name: Resolve Playwright version
        id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Resolve the browser set
        id: browsers
        # Derived from the project list rather than passed separately: a caller
        # that adds `mobile-webkit` and forgets a second "also install webkit"
        # input would fail deep inside Playwright with a browser-not-found, and
        # the two inputs would be free to disagree. One source of truth.
        env:
          PW_PROJECTS: ${{ inputs.projects }}
        run: |
          set -euo pipefail
          list="chromium"
          case " $PW_PROJECTS " in
            *" mobile-webkit "*) list="chromium webkit" ;;
          esac
          echo "list=$list" >> "$GITHUB_OUTPUT"
          # Cache key fragment: a chromium-only cache must not satisfy a run that
          # also needs WebKit, or `install-deps` would be all it ever did.
          echo "key=$(echo "$list" | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          echo "installing: $list"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ steps.browsers.outputs.key }}

      - name: Install browsers
        # The browser downloads (~130 MB Chromium, ~90 MB WebKit) are what the
        # cache saves. Their APT dependencies are NOT cacheable — they live in the
        # runner image, which is rebuilt for every job — so `install-deps` runs
        # either way and only the download is skipped on a hit.
        env:
          PW_BROWSERS: ${{ steps.browsers.outputs.list }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps $PW_BROWSERS
          else
            npx playwright install --with-deps $PW_BROWSERS
          fi

      - uses: supabase/setup-cli@v3
        with:
          # Pinned, not `latest`: `supabase start`'s service names and the key
          # names in `status -o env` are both CLI-version surface, and this suite
          # reads both. Matches the version documented in docs/E2E.md.
          #
          # v3 (not v1): v1 declared `runs: using: node20`, the deprecated JS
          # action runtime GitHub warns about on every run. v3 is a composite
          # action that installs the CLI from npm and only requires an existing
          # Node 20+ on PATH (the setup-node step above already provides Node
          # 22) — no separate runtime declaration to go stale. `version:` still
          # takes a fixed CLI release published to npm; 2.101.0 is on the
          # registry (`npm view supabase versions`), so the pin is unchanged.
          version: 2.101.0

      - name: Start local Supabase
        # `-x` names come from `supabase start --help` for the pinned CLI. What
        # stays is what gets used: `db` holds the schema, `rest` serves every
        # server route, `realtime` carries the move broadcasts, `kong` fronts both
        # (auth is not excludable), and `meta` is the CLI's own schema endpoint.
        # Everything listed here is excluded purely to shave the boot.
        #
        # First start applies supabase/migrations/* in order and then runs
        # supabase/seed.sql — which is deliberately empty (see its header): the
        # suite mints every row it needs through the real API. The migrations are
        # `tictactoe.`-schema-qualified and supabase/config.toml exposes that
        # schema through PostgREST, so a plain local start is enough — no extra
        # `db reset` step and nothing to grant by hand.
        run: supabase start -x studio,inbucket,imgproxy,edge-runtime,analytics,vector,functions,storage

      - name: Point the app at the local Supabase
        # MUST run before the build: NEXT_PUBLIC_* are inlined by the compiler,
        # so a build that ran before this step would ship a bundle pointing at
        # nothing and the browser would never open a Realtime socket.
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          # Names only, never values — enough to diagnose a renamed key across a
          # CLI bump without printing the keys into a public log.
          echo "status -o env exposes: $(cut -d= -f1 "$RUNNER_TEMP/supabase.env" | tr '\n' ' ')"

          set -a
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/supabase.env"
          set +a

          url="${API_URL:-}"
          # Newer CLIs are migrating the local keys to publishable/secret names;
          # accept both so a CLI bump fails loudly here rather than as an opaque
          # "Invalid API key" three steps later.
          anon="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          secret="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"

          missing=""
          [ -n "$url" ] || missing="$missing API_URL"
          [ -n "$anon" ] || missing="$missing ANON_KEY/PUBLISHABLE_KEY"
          [ -n "$secret" ] || missing="$missing SERVICE_ROLE_KEY/SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "::error::supabase status -o env carried no value for:$missing"
            exit 1
          fi

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$url"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon"
            echo "SUPABASE_SERVICE_ROLE_KEY=$secret"
            # The QR/join links read this and fall back to window.location.origin;
            # pinning it keeps the copy deterministic under `next start`.
            echo "NEXT_PUBLIC_BASE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      - name: Build the production bundle
        # Worker lane only: `npm run e2e:server:worker` runs `opennextjs-cloudflare
        # build`, which runs `next build` ITSELF (it has to — it patches the Next
        # config to `output: standalone` for the bundling pass, so a pre-made
        # `.next/` is not the tree it needs). Building here as well would be a
        # second full compile for nothing.
        if: inputs.server != 'worker'
        run: npm run e2e:build

      - name: Worker runtime vars (.dev.vars)
        # The `next start` lane inherits these from the process environment.
        # workerd does not: only what wrangler is told about reaches the isolate,
        # and `process.env` inside the Worker is populated from the Worker's `env`
        # (OpenNext's init template does that on the first request). `.dev.vars`
        # is the file wrangler reads for exactly this, it is gitignored, and it
        # holds values that only exist on this runner for the next few minutes.
        #
        # E2E_SEAM is deliberately NOT here — it is passed as `--var` on the
        # command line in `e2e:server:worker`, so nothing on disk can carry the
        # seam into a real deploy.
        if: inputs.server == 'worker'
        run: |
          set -euo pipefail
          umask 077
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_BASE_URL=$NEXT_PUBLIC_BASE_URL"
          } > .dev.vars
          echo "wrote .dev.vars: $(cut -d= -f1 .dev.vars | tr '\n' ' ')"

      - name: Playwright
        # No `npm run dev`: playwright.config.ts's `webServer` boots the server
        # itself and waits on /api/health. Which server is `E2E_SERVER`'s doing —
        # `npm run e2e:server` (`next start`) or `npm run e2e:server:worker`
        # (`opennextjs-cloudflare build` + `wrangler dev` on wrangler.e2e.jsonc).
        # Either way `E2E_SEAM=1` is carried by the script, never by this
        # workflow. `reuseExistingServer` is `!CI`, so CI always gets a fresh
        # process — there is nothing on :3000 to adopt anyway.
        env:
          PW_PROJECTS: ${{ inputs.projects }}
          E2E_SERVER: ${{ inputs.server }}
          # wrangler's first run otherwise prints a telemetry notice and writes a
          # config file into $HOME; neither belongs in a CI log.
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          args=""
          for p in $PW_PROJECTS; do args="$args --project=$p"; done
          # shellcheck disable=SC2086
          npx playwright test $args

      - name: wrangler dev logs
        # Worker lane only. When `wrangler dev` dies mid-run, the message
        # Playwright shows is whatever wrangler wrote to stderr — and
        # `opennextjs-cloudflare preview` spawns it with stderr PIPED, so that
        # arrives as one buffered dump at exit and can be as little as a bare
        # `✘ [ERROR]` with no text. The stack trace is in wrangler's own log file
        # (it prints "Logs were written to …" and nothing collects it), so
        # collect it here.
        if: failure() && inputs.server == 'worker'
        run: |
          shopt -s nullglob
          found=0
          for f in "$HOME"/.config/.wrangler/logs/*.log .wrangler/logs/*.log; do
            found=1
            echo "::group::$f"
            tail -c 100000 "$f" || true
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "no wrangler log files found"

      - name: Supabase container logs
        if: failure()
        # Realtime refusing a join, or PostgREST rejecting the service key, shows
        # up here and nowhere in the Playwright output.
        run: |
          supabase status || true
          docker ps --format '{{.Names}}\t{{.Status}}' || true
          for c in $(docker ps --filter "name=supabase_" --format '{{.Names}}'); do
            echo "::group::$c"
            docker logs --tail 120 "$c" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Upload HTML report
        # `if: always()` — a green nightly is the only baseline a suspected
        # regression can be diffed against; without this a green run leaves
        # nothing to compare and only a red run was ever inspectable. The report
        # itself is tiny on a pass (no traces/videos — see the next step, which
        # stays failure-only).
        #
        # The `${{ inputs.server }}` suffix is load-bearing, not decoration:
        # nightly.yml now calls this workflow TWICE in the same run, and
        # upload-artifact fails outright on a duplicate artifact name. `next` and
        # `worker` are what tells the two apart in the run's artifact list.
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ inputs.server }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload traces and test results (failure only)
        # `trace: retain-on-failure` and `video: retain-on-failure` mean this
        # directory is empty on a green run — nothing lost by keeping this one
        # failure-only. Open with `npx playwright show-report
        # <unzipped>/playwright-report`, which resolves the trace links inside.
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-${{ inputs.server }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
