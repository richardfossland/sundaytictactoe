# CI — every push/PR runs `npm run check` (lint + typecheck + test), the same
# gate expected locally before committing.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    # The OpenNext/Cloudflare build catches bundling/runtime breaks the check job
    # does NOT — e.g. a Node-runtime middleware OpenNext rejects (exactly what hit
    # this app's proxy.ts) — which otherwise only surface at deploy. (No Cloudflare
    # auth: builds the Worker, it does not deploy.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf:build
