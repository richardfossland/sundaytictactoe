# CI — every push/PR runs `npm run check` (lint + typecheck + test), the same
# gate expected locally before committing.
name: ci
on:
  push:
    branches: [main]
  pull_request:

# One run per ref at a time. A stacked branch push cancels its own superseded
# run (nightly/uptime already do this); `main` never cancels one push's e2e run
# because another push landed mid-flight — a red `main` run must finish so it is
# visible, not vanish under `cancel-in-progress`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    # The OpenNext/Cloudflare build catches bundling/runtime breaks the check job
    # does NOT — e.g. a Node-runtime middleware OpenNext rejects (exactly what hit
    # this app's proxy.ts) — which otherwise only surface at deploy. (No Cloudflare
    # auth: builds the Worker, it does not deploy.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf:build

  # The browser tier — the shipped production bundle, two real browser contexts
  # and a live local Supabase (see .github/workflows/e2e.yml and docs/E2E.md).
  #
  # `needs: check`: this job pays for a Supabase boot, a production build and a
  # browser download. A lint error or a red vitest is not worth those minutes,
  # and its failure would be buried under a browser trace.
  #
  # PRs run the desktop project only; the nightly run adds mobile.
  e2e:
    needs: check
    uses: ./.github/workflows/e2e.yml
    with:
      projects: desktop-chromium
